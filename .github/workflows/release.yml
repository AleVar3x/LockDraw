name: Build and Release APK

on:
  push:
    tags:
      - 'v*'      # Si attiva quando crei un tag (es. v1.0.0, v1.0.1)
  workflow_dispatch: # Permette anche di avviarlo manualmente dall'interfaccia GitHub Actions

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper (if present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      # Crea il file Keystore per la firma dell'APK se configurato nei Secrets di GitHub
      - name: Decode Keystore
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release-keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && '/tmp/release-keystore.jks' || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '' }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Find and Prepare APK for Release
        id: apk_step
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Searching in all build outputs..."
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          # Crea una copia con nome pulito compatibile con Obtanium
          cp "$APK_PATH" LockDraw.apk
          echo "apk_path=LockDraw.apk" >> "$GITHUB_OUTPUT"

      - name: Extract Tag or Version Name
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LockDraw.apk
          tag_name: ${{ steps.version_step.outputs.tag_name }}
          name: "LockDraw ${{ steps.version_step.outputs.tag_name }}"
          body: |
            ## 🎨 LockDraw Update - ${{ steps.version_step.outputs.tag_name }}
            
            Aggiornamento automatico pronto per l'installazione tramite **Obtanium** o download diretto.
            
            ### 📱 Download APK
            - **LockDraw.apk**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
